        // --- Web Audio API for UI Sounds (Hard Beep) ---
        let audioCtx;
        
        function playSound() {
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContext) return; 
                    audioCtx = new AudioContext();
                }
                
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'square'; 
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.setValueAtTime(0, audioCtx.currentTime + 0.1); 
                
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {
                console.log("Audio not supported or blocked", e);
            }
        }

                            "E No correction required"
                        ],
                        answerIndex: 1,
                        answerText: "B The scientist and the policymaker's consensus",
                        explanation: "PDF સ્ત્રોત મુજબ, જ્યારે બે વ્યક્તિઓ વચ્ચે સંયુક્ત માલિકી (Joint possession) હોય (અહી સંયુક્ત સહમતિ 'consensus' છે), ત્યારે માત્ર છેલ્લા શબ્દ પર જ Apostrophe 's' લગાડવામાં આવે છે. તેથી 'The scientist and the policymaker's consensus' સાચું છે.",
                        examples: [
                            "✅ Ram and Shyam's house. (સંયુક્ત ઘર)"

                        trick: "Joint Possession માં છેલ્લા Noun પર જ 's લાગે.",
                        quickRev: "Joint possession: add 's only to the last noun."

            {

                        explanation: "PDF સ્ત્રોત મુજબ, 'Mitigate' (ઘટાડવું) એ Transitive Verb છે, તેથી તેની પછી સીધો જ Object આવે છે, વચ્ચે પ્રેપોઝીશન 'of' ની જરૂર નથી. 'to mitigate the environmental damage' એ સાચું વાક્ય બનશે.",
                        examples: [],
                        trick: "Mitigate + Object (No 'of').",
                        quickRev: "Do not use 'of' after mitigate."
                    },
                    {
                        qText: "Climate researchers analyse the satellite data that may exist, and relate it to finding an evidence of methane leaks...",
                        options: [
                            "A that may have existed, and relating them to find evidence",

                            "C that may have existed, and related them to find an evidence",
                            "D that may have existed, and related it to finding an evidence",
                            "E No correction required"
                        ],
                        answerIndex: 0,
                        answerText: "A that may have existed, and relating them to find evidence",
                        explanation: "PDF સ્ત્રોત મુજબ, 'Data' શબ્દ બહુવચન (Plural) તરીકે વપરાય છે, તેથી તેની સાથે સર્વનામ 'them' આવશે, 'it' નહિ. વળી, 'Evidence' એ અનકાઉન્ટેબલ નાઉન હોવાથી તેની આગળ આર્ટીકલ 'an' નહિ આવે. તેથી 'relating them to find evidence' સાચું છે.",
                        examples: [],
                        trick: "Data = Plural (them). Evidence = Uncountable (No article).",
                        quickRev: "Data is plural (use them). Evidence is uncountable (no 'an')."
                    },
                    {

                        options: [

                            "B Only II",
                            "C Only I and II",
                            "D Only I and III",
                            "E No improvement"
                        ],

                        quickRev: "Lax oversight = weak governance / inadequate regulation."
                    },
                    {

                        examples: [],

                        quickRev: "Catalyst for = Driving force behind = Cornerstone of."
                    },
                    {
                        qText: "The integration of AI-driven smart grids across the 2026 national energy infrastructure is gaining ground slowly because of the complex regulatory hurdles involved...\nI. is progressing sluggishly\nII. is advancing incrementally\nIII. is expanding exponentially",
                        options: [
                            "A. Only I",
                            "B. Only II",
                            "C. Only I and II",
                            "D. Only II and III",
                            "E. No improvement"
                        ],
                        answerIndex: 2,
                        answerText: "C. Only I and II",
                        explanation: "PDF સ્ત્રોત મુજબ, 'gaining ground slowly' (ધીમે ધીમે આગળ વધવું) માટે 'progressing sluggishly' અને 'advancing incrementally' બંને યોગ્ય સમાનાર્થી છે. 'expanding exponentially' નો અર્થ બહુ ઝડપથી વધવું થાય છે, જે મૂળ વાક્યથી વિપરીત છે.",
                        examples: [],
                        trick: "Slowly = Sluggishly = Incrementally.",
                        quickRev: "Gaining ground slowly = Progressing sluggishly = Advancing incrementally."
                    }
                ]
            }
        ];

        // --- Render UI ---
        const homeMenu = document.getElementById('home-menu');
        const detailContent = document.getElementById('detail-content');
        const practiceContent = document.getElementById('practice-content');
        const viewHome = document.getElementById('view-home');
        const viewDetail = document.getElementById('view-detail');
        const viewPractice = document.getElementById('view-practice');
        const btnBack = document.getElementById('btn-back');
        const btnTheme = document.getElementById('btn-theme');

        const tileColors = ['#FF4757', '#2ED573', '#1E90FF', '#FFA502', '#9C88FF', '#FF6348'];

        let isDarkMode = false;
        btnTheme.addEventListener('click', () => {
            playSound();
            isDarkMode = !isDarkMode;
            document.body.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
            btnTheme.innerText = isDarkMode ? '☀️' : '🌙';
        });

        function showView(viewElement) {
            viewHome.classList.remove('active');
            viewDetail.classList.remove('active');
            viewPractice.classList.remove('active');
            viewElement.classList.add('active');
            window.scrollTo(0, 0);
        }

        function initHome() {
            homeMenu.innerHTML = '';
            
            studyData.forEach((section, index) => {
                const btn = document.createElement('button');
                btn.className = 'topic-btn';
                btn.innerText = section.topic;
                btn.style.backgroundColor = tileColors[index % tileColors.length];
                
                btn.onclick = () => {
                    playSound();
                    renderDetailView(index);
                };
                homeMenu.appendChild(btn);
            });

            const memoryBtn = document.createElement('button');
            memoryBtn.className = 'topic-btn';
            memoryBtn.innerText = "🔥 FINAL MEMORY SHEET";
            memoryBtn.style.backgroundColor = "#5352ED";
            memoryBtn.onclick = () => {
                playSound();
                renderMemorySheet();
            };
            homeMenu.appendChild(memoryBtn);

            const mockBtn = document.createElement('button');
            mockBtn.className = 'topic-btn';
            mockBtn.innerText = "📝 PRACTICE MOCK";
            mockBtn.style.backgroundColor = "#34495e";
            mockBtn.onclick = () => {
                playSound();
                renderPracticeMock();
            };
            homeMenu.appendChild(mockBtn);
            
            btnBack.style.display = 'none';
            showView(viewHome);
        }

        btnBack.onclick = () => {
            playSound();
            initHome();
        };

        function renderDetailView(sectionIndex) {
            const section = studyData[sectionIndex];
            let html = `<div class="card-header" style="font-size:1.5rem; border-bottom: 3px solid var(--primary); margin-bottom: 25px;">${section.topic}</div>`;

            section.questions.forEach((q, i) => {
                html += `
                <div class="card">
                    <div class="section-title">Question ${i + 1}</div>
                    <div class="question-text">${q.qText.replace(/\n/g, '<br>')}</div>
                    
                    <ul class="options-list">
                        ${q.options.map(opt => `<li>${opt}</li>`).join('')}
                    </ul>

                    <div class="section-title">✅ ANSWER</div>
                    <p style="font-weight:bold; color:var(--secondary); margin-bottom: 15px; font-size:1.1rem;">${q.answerText}</p>

                    <div class="section-title">🧠 COMPLETE EXPLANATION</div>
                    <p>${q.explanation}</p>
                    
                    ${q.examples.length > 0 ? `
                        <div class="section-title">✍️ EXAMPLES</div>
                        ${q.examples.map(ex => `<p>${ex}</p>`).join('')}
                    ` : ''}

                    ${q.trick ? `
                        <div class="exam-trick">
                            <strong>🎯 EXAM TRICK:</strong><br>
                            ${q.trick.replace(/\n/g, '<br>')}
                        </div>
                    ` : ''}

                    <div class="section-title">⚡ QUICK REVISION</div>
                    <div class="quick-revision">${q.quickRev}</div>
                </div>
                `;
            });

            detailContent.innerHTML = html;
            btnBack.style.display = 'block';
            showView(viewDetail);
        }

        function renderMemorySheet() {
            let html = `
                <div class="card-header" style="font-size:1.5rem; border-bottom: 3px solid var(--primary); margin-bottom: 25px;">🔥 FINAL MEMORY SHEET</div>
                <div class="card">
                    <div class="section-title">1. Grammar Rules</div>
                    <ul>
                        <li><strong>A number of:</strong> હમેશા Plural verb (were) લેશે.</li>
                        <li><strong>State Verbs:</strong> Forget, think, understand, hesitate નું V-ing (continuous) સ્વરૂપ ના બને.</li>
                        <li><strong>Of the two:</strong> જ્યારે બે ની સરખામણી હોય ત્યારે Comparative degree ની આગળ 'the' ચોક્કસ લાગે.</li>
                        <li><strong>Parallelism:</strong> 'And' ની બંને બાજુ માળખું સમાન હોવું જોઈએ (V-ing and V-ing).</li>
                        <li><strong>Prepositions:</strong> Indifferent/Apathetic + to. Concerned/Unconcerned + about.</li>
                        <li><strong>Shortage:</strong> Shortage, lack, paucity, scarcity + of. Invest + in.</li>
                        <li><strong>Adverb Placement:</strong> Transitive verb અને Object ની વચ્ચે Adverb ના મુકાય. (તેને આગળ કે પાછળ મૂકો).</li>
                        <li><strong>Indignant:</strong> Indignant + with (Person), Indignant + at (Thing/Action).</li>
                        <li><strong>Emphasize:</strong> Emphasize પછી કોઈ પ્રેપોઝીશન (on) ના આવે.</li>
                        <li><strong>Data & Evidence:</strong> Data બહુવચન (them) છે, Evidence અનકાઉન્ટેબલ (No 'an') છે.</li>
                    </ul>

                    <div class="section-title" style="margin-top:20px;">2. Important Phrasal Verbs & Idioms</div>
                    <table>
                        <tr><th>Phrase/Idiom</th><th>Meaning</th></tr>
                        <tr><td>Account for / Take into account</td><td>ધ્યાનમાં લેવું (Consider)</td></tr>
                        <tr><td>Take a firm stand</td><td>મજબૂતીથી ટેકો આપવો (Strongly support)</td></tr>
                        <tr><td>Look forward to</td><td>(Phrasal verb) હમેશા V-ing લેશે (e.g., meeting)</td></tr>
                        <tr><td>Iron out</td><td>સમસ્યાનો ઉકેલ લાવવો (Resolve)</td></tr>
                        <tr><td>Spanner in the works</td><td>ચાલતું કામ અટકાવવું (Disrupt/Halt)</td></tr>
                        <tr><td>At loggerheads</td><td>ઝઘડો કે મતભેદ હોવા (In conflict)</td></tr>
                        <tr><td>Jump through hoops</td><td>કોઈ કામ માટે બહુ મુશ્કેલીઓ વેઠવી</td></tr>
                        <tr><td>Live hand to mouth</td><td>માંડ માંડ ગુજરાન ચલાવવું</td></tr>
                        <tr><td>Renege on</td><td>વચનભંગ કરવો (Back out of / Default on)</td></tr>
                        <tr><td>Put off / Discourage from</td><td>નિરાશ કરવું / અટકાવવું</td></tr>
                    </table>

                    <div class="section-title" style="margin-top:20px;">3. Exam Tricks</div>
                    <ul>
                        <li>વાક્યમાં Verb ગણો અને Subject ગણો. જો Verb વધે તો Object (whom) ની જગ્યાએ Subject (who) મૂકો.</li>
                        <li>Quite અને Comparative degree ક્યારેય ભેગા ના વાપરો (Superfluous).</li>
                        <li>3rd Conditional: <code>Had + V3</code> આવે તો સામે <code>would/could/might + have + V3</code> મૂકવું.</li>
                        <li>Joint Possession (સંયુક્ત માલિકી) માં માત્ર છેલ્લા શબ્દ પર જ 's (Apostrophe) લગાડો.</li>
                        <li>Mitigate એક Transitive verb છે, તેની પાછળ 'of' ના આવે.</li>
                    </ul>
                </div>
            `;
            detailContent.innerHTML = html;
            btnBack.style.display = 'block';
            showView(viewDetail);
        }

        let mockQuestions = [];
        let currentMockIndex = 0;
        let mockScore = { correct: 0, wrong: 0, skipped: 0 };
        let answered = false;

        function renderPracticeMock() {
            mockQuestions = [];
            studyData.forEach(section => {
                section.questions.forEach(q => {
                    mockQuestions.push({
                        ...q,
                        topicStr: section.topic
                    });
                });
            });

            currentMockIndex = 0;
            mockScore = { correct: 0, wrong: 0, skipped: 0 };
            btnBack.style.display = 'block';
            
            showMockQuestion();
            showView(viewPractice);
        }

        function showMockQuestion() {
            if (currentMockIndex >= mockQuestions.length) {
                showMockResult();
                return;
            }

            answered = false;
            const q = mockQuestions[currentMockIndex];
            let html = `
                <div class="card-header" style="font-size:1.2rem; display:flex; justify-content:space-between;">
                    <span>📝 PRACTICE MOCK</span>
                    <span>Q ${currentMockIndex + 1} / ${mockQuestions.length}</span>
                </div>
                <div class="card">
                    <div style="font-size: 0.9rem; color: #7f8c8d; margin-bottom: 10px;">${q.topicStr}</div>
                    <div class="question-text">${q.qText.replace(/\n/g, '<br>')}</div>
                    <div id="mock-options-container">
                        ${q.options.map((opt, i) => `
                            <button class="mock-option" onclick="selectMockOption(${i}, this)">${opt}</button>
                        `).join('')}
                    </div>
                    <button class="action-btn" style="background-color: #95a5a6;" onclick="skipMockQuestion()" id="btn-skip">Skip Question</button>
                    <button class="action-btn" style="display:none;" onclick="nextMockQuestion()" id="btn-next">Next Question →</button>
                    
                    <div class="result-box" id="mock-result-box"></div>
                </div>
            `;
            practiceContent.innerHTML = html;
        }

        function selectMockOption(selectedIndex, btnElement) {
            if (answered) return;
            answered = true;
            playSound();
            
            const q = mockQuestions[currentMockIndex];
            const isCorrect = selectedIndex === q.answerIndex;
            
            if (isCorrect) {
                btnElement.classList.add('correct');
                mockScore.correct++;
            } else {
                btnElement.classList.add('wrong');
                mockScore.wrong++;
                document.querySelectorAll('.mock-option')[q.answerIndex].classList.add('correct');
            }

            document.getElementById('btn-skip').style.display = 'none';
            document.getElementById('btn-next').style.display = 'inline-block';

            const resultBox = document.getElementById('mock-result-box');
            resultBox.style.display = 'block';
            resultBox.style.backgroundColor = isCorrect ? 'rgba(46, 204, 113, 0.1)' : 'rgba(231, 76, 60, 0.1)';
            resultBox.innerHTML = `
                <strong style="color: ${isCorrect ? 'var(--secondary)' : 'var(--danger)'};">
                    ${isCorrect ? '✅ CORRECT' : '❌ INCORRECT'}
                </strong><br><br>
                <strong>Correct Answer:</strong> ${q.answerText}<br>
                <p style="margin-top:10px; font-size:0.95rem;">${q.explanation}</p>
            `;
        }

        function skipMockQuestion() {
            playSound();
            mockScore.skipped++;
            currentMockIndex++;
            showMockQuestion();
        }

        function nextMockQuestion() {
            playSound();
            currentMockIndex++;
            showMockQuestion();
        }

        function showMockResult() {
            const total = mockQuestions.length;
            const percentage = Math.round((mockScore.correct / total) * 100);
            
            let html = `
                <div class="card-header" style="font-size:1.5rem;">🏆 FINAL SCORE</div>
                <div class="card score-board">
                    <h2>${percentage}%</h2>
                    <p style="font-size:1.2rem; margin-bottom:10px;">Total Questions: <strong>${total}</strong></p>
                    <p style="font-size:1.2rem; margin-bottom:10px; color:var(--secondary)">Correct: <strong>${mockScore.correct}</strong></p>
                    <p style="font-size:1.2rem; margin-bottom:10px; color:var(--danger)">Wrong: <strong>${mockScore.wrong}</strong></p>
                    <p style="font-size:1.2rem; margin-bottom:20px; color:#95a5a6">Skipped: <strong>${mockScore.skipped}</strong></p>
                    <button class="action-btn" onclick="initHome()">Return to Home</button>
                </div>
            `;
            practiceContent.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', initHome);

    </script>
</body>
</html>
