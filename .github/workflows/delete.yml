name: Delete Multiple Files

on:
  workflow_dispatch:

jobs:
  delete_files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove m mains HTML files
        run: |
          # ૧૫૧ થી ૨૦૩ નંબરની બધી ફાઇલો લૂપ દ્વારા ડિલીટ થશે
          for i in {151..203}; do
            rm -f "m mains ($i).html"
          done
          
          # ફેરફારો ગિટમાં કમિટ કરવા
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Cleanup: Deleted m mains files 151 to 203"
          git push
