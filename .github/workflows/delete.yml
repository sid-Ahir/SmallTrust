name: Delete Daywise Quiz Files

on:
  workflow_dispatch:

jobs:
  delete_quiz_files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove Quiz HTML files
        run: |
          # ૧ થી ૨૦૦ સુધીના દિવસોની ફાઇલો ડિલીટ કરવા માટે (અહીં તમારી ફાઇલના નામની સાચી સ્પેલિંગ મુજબ પેટર્ન છે)
          for i in {1..200}; do
            rm -f "Mains Mastery Quiz 2026 English (Day-$i).html"
            rm -f "Mains Mastery Quiz 2026 English (Day - $i).html"
            rm -f "Mains Mastery Quiz 2026 English (Day -૨૦૦).html"
          done
          
          # ફેરફારો ગિટમાં કમિટ કરવા
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Cleanup: Deleted Day 1 to Day 200 quiz files"
          git push
