name: Delete Old Mock and Computer Awareness Files

on:
  workflow_dispatch: # આનાથી તમે GitHub પર જઈને મેન્યુઅલી 'Run workflow' કરી શકશો

jobs:
  delete-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Delete Files via Script
        env:
          GH_TOKEN: "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"
          OWNER: "Sid-Ahir"
          REPO: "SmallTrust"
          BRANCH: "main"
        run: |
          node -e '
          const TOKEN = process.env.GH_TOKEN;
          const OWNER = process.env.OWNER;
          const REPO = process.env.REPO;
          const BRANCH = process.env.BRANCH;

          async function run() {
            let filesToDelete = [];
            for (let i = 1; i <= 30; i++) {
              filesToDelete.push(`Full_Length_Test_SBI_Clerk_2025_Prelims_Mock_Test_${i}_BILINGUAL.html`);
            }
            for (let i = 1; i <= 60; i++) {
              filesToDelete.push(`Computer Awareness Bundle PDF Course 2025 Set-${i}.html`);
            }

            for (const fileName of filesToDelete) {
              try {
                const getRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(fileName)}?ref=${BRANCH}`, {
                  headers: { "Authorization": `token ${TOKEN}`, "Accept": "application/vnd.github.v3+json" }
                });
                if (!getRes.ok) continue;
                const fileData = await getRes.json();
                
                const delRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(fileName)}`, {
                  method: "DELETE",
                  headers: { "Authorization": `token ${TOKEN}`, "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json" },
                  body: JSON.stringify({ message: `Delete ${fileName} via workflow`, sha: fileData.sha, branch: BRANCH })
                });
                if (delRes.ok) console.log(`✅ Deleted: ${fileName}`);
              } catch (e) {
                console.log(`❌ Error ${fileName}:`, e.message);
              }
            }
          }
          run();
          '
