name: Delete Multiple Files

on:
  workflow_dispatch:

jobs:
  delete_files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove m mains HTML files
        run: |
          # ૧ થી ૧૫૦ નંબરની બધી ફાઇલો લૂપ દ્વારા ડિલીટ થશે
          for i in {1..150}; do
            rm -f "m mains ($i).html"
          done
          
          # ફેરફારો ગિટમાં કમિટ કરવા
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Cleanup: Deleted m mains files 1 to 150"
          git push
