name: Delete Range Reasoning Files
on:
  workflow_dispatch:

jobs:
  delete_bulk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove specific range of reasoning files 51 to 100
        run: |
          for i in {51..100}; do
            rm -f "Mains master reasoning($i).html"
            rm -f "mains master reasoning($i).html"
          done
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Cleanup: Deleted Reasoning files 51 to 100"
          git push
