const TOKEN = "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"; 
const OWNER = "Sid-Ahir";
const REPO = "SmallTrust";
const BRANCH = "main";

async function deleteFiles() {
  let filesToDelete = [];

  // 1. SBI Clerk Mock Test 1 થી 30
  for (let i = 1; i <= 30; i++) {
    filesToDelete.push(`Full_Length_Test_SBI_Clerk_2025_Prelims_Mock_Test_${i}_BILINGUAL.html`);
  }

  // 2. Computer Awareness Set 1 થી 60
  for (let i = 1; i <= 60; i++) {
    filesToDelete.push(`Computer Awareness Bundle PDF Course 2025 Set-${i}.html`);
  }

  for (const fileName of filesToDelete) {
    try {
      const getResponse = await fetch(
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/${fileName}?ref=${BRANCH}`,
        {
          headers: {
            "Authorization": `token ${TOKEN}`,
            "Accept": "application/vnd.github.v3+json"
          }
        }
      );
      
      if (!getResponse.ok) {
        console.log(`❌ ${fileName} મળી નહીં.`);
        continue;
      }
      
      const fileData = await getResponse.json();
      const sha = fileData.sha;

      const deleteResponse = await fetch(
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/${fileName}`,
        {
          method: "DELETE",
          headers: {
            "Authorization": `token ${TOKEN}`,
            "Accept": "application/vnd.github.v3+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Delete ${fileName} via script`,
            sha: sha,
            branch: BRANCH
          })
        }
      );
      
      if (deleteResponse.ok) {
        console.log(`✅ ડિલીટ થઈ ગઈ: ${fileName}`);
      } else {
        console.log(`⚠️ ડિલીટ ન થઈ શકી: ${fileName}`);
      }
    } catch (error) {
      console.log(`❌ એરર આવી ${fileName}:`, error);
    }
  }
  console.log("🎉 બધી નિર્ધારિત ફાઇલો ડિલીટ કરવાનું કામ પૂરું થયું!");
}

deleteFiles();
