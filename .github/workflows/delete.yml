name: Delete Reasoning Quiz Up To 200
on:
  workflow_dispatch:

jobs:
  delete_bulk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove Reasoning Quiz files 1 to 200
        run: |
          for i in {1..200}; do
            rm -f "Mains Mastery Quiz 2026 Reasoning (Day-$i).html"
          done
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Cleanup: Deleted Reasoning Quiz files 1 to 200"
          git push
