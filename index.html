<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sid Ahir - Preparation App</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .sticky-home {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(43, 16, 85, 0.85);
            color: white;
            border: 1px solid #00ffff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            z-index: 1000;
            transition: 0.3s;
            cursor: pointer;
        }

        .sticky-home:hover {
            background: rgba(61, 23, 120, 0.95);
            transform: scale(1.1);
            box-shadow: 0 0 15px #00ffff;
        }

        .profile-container {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #fff;
            object-fit: cover;
            margin-bottom: 15px;
            animation: neon-blink 1.2s infinite alternate;
        }

        @keyframes neon-blink {
            from { box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; }
            to { box-shadow: 0 0 25px #00aaff, 0 0 45px #00aaff; }
        }

        .profile-name {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
        }

        .button-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 380px;
        }

        .nav-btn {
            background: linear-gradient(135deg, #2b1055, #14082e);
            color: white;
            padding: 12px 10px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid #56279e;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .nav-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #3d1778, #1e0b45);
            border-color: #00ffff;
            box-shadow: 0 0 18px rgba(0, 255, 255, 0.5);
        }

        .subject-btn {
            background: linear-gradient(135deg, #1f4068, #162447);
            border-color: #00ffff;
        }

        .practice-btn {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            border-color: #00ffff;
        }

        .mock-btn {
            background: linear-gradient(135deg, #134e5e, #71b280);
            border-color: #00ff88;
        }

        .exam-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border-color: #ff4b2b;
        }

        .exam-btn:hover {
            background: linear-gradient(135deg, #ff4b2b, #ff416c);
            border-color: #fff;
            box-shadow: 0 0 18px rgba(255, 75, 43, 0.6);
        }

        .timer-text {
            font-size: 11px;
            color: #00ffff;
            margin-top: 5px;
            font-weight: normal;
        }

        .screen { display: none; width: 100%; max-width: 400px; flex-direction: column; align-items: center; }
        .active { display: flex; }

        .details-box {
            background: #222;
            border: 2px solid #00ffff;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        .details-box h3 {
            color: #ffcc00;
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
            font-size: 16px;
        }

        .details-box p {
            color: #ddd;
            line-height: 1.5;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .big-timer {
            font-size: 16px;
            font-weight: bold;
            color: #ff4b2b;
            text-align: center;
            margin-top: 8px;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(255, 75, 43, 0.4);
        }

        .screen-title {
            color: #00ffff; 
            text-align: center; 
            margin-bottom: 20px;
            font-size: 22px;
        }

        .section-divider {
            width: 100%;
            text-align: center;
            color: #ffcc00;
            font-weight: bold;
            margin: 15px 0 10px 0;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
            font-size: 14px;
        }

        .day-grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 380px;
        }

        .day-card {
            background: rgba(43, 16, 85, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: 0.3s;
        }

        .day-card:hover {
            border-color: #00ffff;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .day-btn-glass {
            color: white;
            font-size: 13.5px;
            font-weight: bold;
            text-decoration: none;
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            background: none;
            border: none;
            text-align: left;
        }

        .day-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #00ff88;
            margin-left: 8px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="sticky-home" onclick="goHome()" title="Home">🏠</div>

    <!-- ==================== HOME SCREEN ==================== -->
    <div id="home-screen" class="screen active">
        <div class="profile-container">
            <img src="profile.jpg" alt="Sid Ahir" class="profile-pic">
            <div class="profile-name">✨ Sid Ahir ✨</div>
        </div>

        <div class="button-container">
            <button class="nav-btn" onclick="openFile('maths.html')">📐 Maths</button>
            <button class="nav-btn" onclick="openFile('english.html')">📝 English</button>
            
            <button class="nav-btn" onclick="openFile('ga-ca.html')">🌍 GA & CA</button>
            <button class="nav-btn" onclick="openFile('ga.html')">🌍 G. A.</button>
            
            <button class="nav-btn" onclick="showComputer()">💻 Computer</button>
            <button class="nav-btn" onclick="openFile('checklist.html')">✅ Check List</button>

            <div class="nav-btn practice-btn" onclick="showScreen('practice-main-screen')">🎯 Practice</div>
            <div class="nav-btn mock-btn" onclick="showScreen('mock-main-screen')">📊 Mock Test</div>

            <div class="nav-btn exam-btn" onclick="showExam('ibps')">
                <span>🏦 IBPS</span>
                <span class="timer-text" id="ibps-mini-timer">Loading...</span>
            </div>
            <div class="nav-btn exam-btn" onclick="showExam('rrb')">
                <span>🏛️ RRB</span>
                <span class="timer-text" id="rrb-mini-timer">Loading...</span>
            </div>
        </div>
    </div>

    <!-- ==================== COMPUTER SCREEN ==================== -->
    <div id="comp-screen" class="screen">
        <h2 class="screen-title">Computer Sets</h2>
        <div class="day-grid-container" id="comp-list"></div>
    </div>

    <!-- ==================== PRACTICE MAIN SCREEN ==================== -->
    <div id="practice-main-screen" class="screen">
        <h2 class="screen-title">🎯 Practice Section</h2>
        <div class="button-container">
            <div class="nav-btn" onclick="showPracticeSub('pre')">⚡ PRE</div>
            <div class="nav-btn" onclick="showPracticeSub('mains')">🔥 MAINS</div>
        </div>
    </div>

    <!-- ==================== PRACTICE SUB SCREEN (SUBJECTS) ==================== -->
    <div id="practice-sub-screen" class="screen">
        <h2 class="screen-title" id="practice-sub-title">Practice Subjects</h2>
        <div class="button-container">
            <div class="nav-btn subject-btn" onclick="openPracticeDayList('english')">📝 English</div>
            <div class="nav-btn subject-btn" onclick="openPracticeDayList('maths')">📐 Maths</div>
            <div class="nav-btn subject-btn" onclick="openPracticeDayList('reasoning')">🧠 Reasoning</div>
        </div>
    </div>

    <!-- ==================== PRACTICE DAY LIST SCREEN ==================== -->
    <div id="practice-day-screen" class="screen" style="max-width: 400px;">
        <h2 class="screen-title" id="practice-day-title">Day List</h2>
        <div id="practice-day-container" class="day-grid-container"></div>
    </div>

    <!-- ==================== MOCK MAIN SCREEN ==================== -->
    <div id="mock-main-screen" class="screen">
        <h2 class="screen-title">📊 Mock Tests</h2>
        <div class="button-container">
            <div class="nav-btn" onclick="showMockSub('pre')">⚡ PRE Mock</div>
            <div class="nav-btn" onclick="showMockSub('mains')">🔥 MAINS Mock</div>
        </div>
    </div>

    <!-- ==================== MOCK SUB SCREEN ==================== -->
    <div id="mock-sub-screen" class="screen">
        <h2 class="screen-title" id="mock-sub-title">Mock Exams</h2>
        <div class="button-container">
            <button class="nav-btn" onclick="openMockList('sbi-clerk')">SBI Clerk</button>
            <button class="nav-btn" onclick="openMockList('ibps-clerk')">IBPS Clerk</button>
            <button class="nav-btn" onclick="openMockList('rrb-po')">RRB PO</button>
            <button class="nav-btn" onclick="openMockList('rrb-clerk')">RRB Clerk</button>
        </div>
    </div>

    <!-- ==================== MOCK LIST SCREEN ==================== -->
    <div id="mock-list-screen" class="screen">
        <h2 class="screen-title" id="mock-list-title">Mock Tests</h2>
        <div class="button-container" id="mock-dynamic-list"></div>
    </div>

    <!-- ==================== EXAM DETAILS SCREEN ==================== -->
    <div id="exam-screen" class="screen">
        <h2 id="exam-title" class="screen-title">Exam Schedule</h2>
        <div class="details-box" id="exam-content"></div>
    </div>

    <script>
        let currentExamIntervals = [];

        function openFile(filename) {
            if (filename === '#' || !filename) return;
            if (filename.toLowerCase().endsWith('.pdf')) {
                let fullUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/')) + '/' + filename;
                window.open('https://docs.google.com/viewer?url=' + encodeURIComponent(fullUrl) + '&embedded=true', '_blank');
            } else {
                window.open(encodeURI(filename), '_blank');
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            clearAllIntervals();
        }

        function clearAllIntervals() {
            currentExamIntervals.forEach(clearInterval);
            currentExamIntervals = [];
        }

        function updateMiniTimers() {
            const now = new Date().getTime();
            const ibpsTarget = new Date('2026-10-10T09:00:00').getTime();
            const rrbTarget = new Date('2026-11-21T09:00:00').getTime();

            function getRemaining(target) {
                const diff = target - now;
                if (diff <= 0) return "Exam Started!";
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                return `${days}d ${hours}h ${mins}m left`;
            }

            document.getElementById('ibps-mini-timer').innerText = getRemaining(ibpsTarget);
            document.getElementById('rrb-mini-timer').innerText = getRemaining(rrbTarget);
        }
        setInterval(updateMiniTimers, 60000);
        updateMiniTimers();

        function showComputer() {
            showScreen('comp-screen');
            const list = document.getElementById('comp-list');
            list.innerHTML = ""; 
            
            for(let i = 1; i <= 60; i++) {
                let fileName = ""; 
                
                let card = document.createElement('div');
                card.className = "day-card";

                let btn = document.createElement('button');
                btn.className = "day-btn-glass";
                btn.innerText = "Set " + i;
                btn.onclick = (function(f) { return function() { openFile(f); }; })(fileName);

                let checkbox = document.createElement('input');
                checkbox.type = "checkbox";
                checkbox.className = "day-checkbox";
                
                let storageKey = `computer_set_${i}`;
                if (localStorage.getItem(storageKey) === 'true') {
                    checkbox.checked = true;
                }

                checkbox.addEventListener('change', (function(key, chk) {
                    return function() { localStorage.setItem(key, chk.checked); };
                })(storageKey, checkbox));

                card.appendChild(btn);
                card.appendChild(checkbox);
                list.appendChild(card);
            }
        }

        function showPracticeSub(type) {
            showScreen('practice-sub-screen');
            document.getElementById('practice-sub-title').innerText = type === 'pre' ? "⚡ PRE Practice Subjects" : "🔥 MAINS Practice Subjects";
        }

        function openPracticeDayList(subject) {
            showScreen('practice-day-screen');
            const title = document.getElementById('practice-day-title');
            const container = document.getElementById('practice-day-container');
            container.innerHTML = "";

            title.innerText = `Practice - ${subject.toUpperCase()}`;

            for (let i = 1; i <= 100; i++) {
                let fileName = ""; 

                let card = document.createElement('div');
                card.className = "day-card";

                let btn = document.createElement('button');
                btn.className = "day-btn-glass";
                btn.innerText = `Day ${i}`;
                btn.onclick = (function(f) { return function() { openFile(f); }; })(fileName);

                let checkbox = document.createElement('input');
                checkbox.type = "checkbox";
                checkbox.className = "day-checkbox";
                
                let storageKey = `practice_${subject}_day_${i}`;
                if (localStorage.getItem(storageKey) === 'true') {
                    checkbox.checked = true;
                }

                checkbox.addEventListener('change', (function(key, chk) {
                    return function() { localStorage.setItem(key, chk.checked); };
                })(storageKey, checkbox));

                card.appendChild(btn);
                card.appendChild(checkbox);
                container.appendChild(card);
            }
        }

        let currentMockType = 'pre'; 

        function showMockSub(type) {
            currentMockType = type;
            showScreen('mock-sub-screen');
            document.getElementById('mock-sub-title').innerText = type === 'pre' ? "⚡ PRE Mock Exams" : "🔥 MAINS Mock Exams";
        }

        function openMockList(examName) {
            showScreen('mock-list-screen');
            const title = document.getElementById('mock-list-title');
            const list = document.getElementById('mock-dynamic-list');
            list.innerHTML = "";

            let totalTests = 0;
            let filePrefix = "";
            let fileSuffix = "_BILINGUAL.html";

            if (examName === 'rrb-po' && currentMockType === 'pre') {
                title.innerText = "RRB PO Prelims Mocks";
                totalTests = 20;
                filePrefix = "Full_Length_Test_IBPS_RRB_PO_Prelims_2025_Mock_Test_";
            } else if (examName === 'sbi-clerk' && currentMockType === 'pre') {
                title.innerText = "SBI Clerk Prelims Mocks";
                totalTests = 20;
                filePrefix = "Full_Length_Test_SBI_Clerk_2025_Prelims_Mock_Test_";
            } else if (examName === 'ibps-clerk' && currentMockType === 'pre') {
                title.innerText = "IBPS Clerk Prelims Mocks";
                totalTests = 20;
                filePrefix = "Full_Length_Test_IBPS_Clerk_2025_Prelims_Mock_Test_";
            } else {
                title.innerText = "Mock Tests";
                totalTests = 0;
            }

            let subHeader = document.createElement('div');
            subHeader.className = "section-divider";
            subHeader.innerText = "📚 Subjects";
            list.appendChild(subHeader);

            let engBtn = document.createElement('button');
            engBtn.className = "nav-btn";
            engBtn.innerText = "📝 English";
            engBtn.onclick = function() { openFile('#'); };
            list.appendChild(engBtn);

            let mathBtn = document.createElement('button');
            mathBtn.className = "nav-btn";
            mathBtn.innerText = "📐 Maths";
            mathBtn.onclick = function() { openFile('#'); };
            list.appendChild(mathBtn);

            let reaBtn = document.createElement('button');
            reaBtn.className = "nav-btn";
            reaBtn.innerText = "🧠 Reasoning";
            reaBtn.onclick = function() { openFile('#'); };
            list.appendChild(reaBtn);

            if (totalTests === 0) {
                let msg = document.createElement('div');
                msg.style.cssText = "grid-column: span 2; color:#ff4b2b; text-align:center; margin-top:15px; font-weight:bold;";
                msg.innerText = "આ મોક ટેસ્ટ ટૂંક સમયમાં ઉપલબ્ધ થશે!";
                list.appendChild(msg);
                return;
            }

            let mockHeader = document.createElement('div');
            mockHeader.className = "section-divider";
            mockHeader.style.marginTop = "15px";
            mockHeader.innerText = "📊 Mock Tests";
            list.appendChild(mockHeader);

            for (let i = 1; i <= totalTests; i++) {
                let fileName = `${filePrefix}${i}${fileSuffix}`;
                let btn = document.createElement('button');
                btn.className = "nav-btn";
                btn.innerText = `Mock Test - ${i}`;
                btn.onclick = (function(f) { return function() { openFile(f); }; })(fileName);
                list.appendChild(btn);
            }
        }

        function showExam(type) {
            showScreen('exam-screen');
            const title = document.getElementById('exam-title');
            const content = document.getElementById('exam-content');

            if(type === 'ibps') {
                title.innerText = "🏦 IBPS PO & Clerk Schedule";
                content.innerHTML = `
                    <h3>⚡ Prelims Exam (Oct 10-11, 2026)</h3>
                    <div class="big-timer" id="timer-ibps-pre">Loading...</div>
                    
                    <h3>🔥 Mains Exam (Dec 27, 2026)</h3>
                    <div class="big-timer" id="timer-ibps-mains">Loading...</div>
                `;
                setupCountdown('2026-10-10T09:00:00', 'timer-ibps-pre');
                setupCountdown('2026-12-27T09:00:00', 'timer-ibps-mains');
            } else {
                title.innerText = "🏛️ IBPS RRB Schedule";
                content.innerHTML = `
                    <h3>⚡ RRB PO Prelims (Nov 21-22, 2026)</h3>
                    <div class="big-timer" id="timer-rrb-po-pre">Loading...</div>
                    
                    <h3>🔥 RRB PO Mains (Dec 20, 2026)</h3>
                    <div class="big-timer" id="timer-rrb-po-mains">Loading...</div>
                    
                    <h3 style="margin-top:12px;">⚡ RRB Clerk Prelims (Dec 6, 12-13, 2026)</h3>
                    <div class="big-timer" id="timer-rrb-clerk-pre">Loading...</div>
                    
                    <h3>🔥 RRB Clerk Mains (Jan 30, 2027)</h3>
                    <div class="big-timer" id="timer-rrb-clerk-mains">Loading...</div>
                `;
                setupCountdown('2026-11-21T09:00:00', 'timer-rrb-po-pre');
                setupCountdown('2026-12-20T09:00:00', 'timer-rrb-po-mains');
                setupCountdown('2026-12-06T09:00:00', 'timer-rrb-clerk-pre');
                setupCountdown('2027-01-30T09:00:00', 'timer-rrb-clerk-mains');
            }
        }

        function setupCountdown(targetDateStr, elementId) {
            const targetDate = new Date(targetDateStr).getTime();

            function updateTimer() {
                const now = new Date().getTime();
                const diff = targetDate - now;
                const el = document.getElementById(elementId);
                
                if (!el) return;

                if (diff <= 0) {
                    el.innerText = "Exam Started!";
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);

                el.innerText = `${days}d : ${hours}h : ${mins}m : ${secs}s`;
            }
            
            updateTimer();
            let interval = setInterval(updateTimer, 1000);
            currentExamIntervals.push(interval);
        }

        function goHome() {
            showScreen('home-screen');
        }
    </script>
</body>
</html>
